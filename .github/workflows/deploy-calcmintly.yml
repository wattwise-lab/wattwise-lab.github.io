name: Deploy CalcMintly
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-calcmintly.yml
      - .github/workflows/calcmintly-site.tgz
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace legacy site with CalcMintly build
        run: |
          cp .github/workflows/calcmintly-site.tgz /tmp/calcmintly-site.tgz
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/calcmintly-site.tgz -C .
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Launch CalcMintly calculator platform"
          git push
