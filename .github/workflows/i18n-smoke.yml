name: Locale structure checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  locales:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/i18n-smoke.mjs
      - run: node scripts/release-check.mjs --strict-i18n
